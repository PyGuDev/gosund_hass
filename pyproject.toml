[project]
name = "gosund-ep8"
version = "0.1.0"
description = "Home Assistant Integration for Gosund EP8 local Relay control"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
